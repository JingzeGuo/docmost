name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @docmost/editor-ext build

      - run: pnpm --filter @docmost/base-formula build

      - run: pnpm --filter client test

      - run: >
          pnpm --filter server test --runInBand --silent
          --testPathPatterns='src/(common|core/(public-space/public-space.service|page/(services/backlink.service|transclusion/spec/transclusion))|integrations/(encryption|outbound|storage/drivers))'

      - run: pnpm build

  docker-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docmost:test .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docmost:test
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag docmost:test ghcr.io/jingzeguo/docmost:${{ github.sha }}
          docker push ghcr.io/jingzeguo/docmost:${{ github.sha }}

  deploy:
    needs: [test-and-build, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy through SSM
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ssm-command.json" <<EOF
          {
            "DocumentName": "AWS-RunShellScript",
            "Targets": [
              {
                "Key": "tag:Project",
                "Values": ["docmost"]
              }
            ],
            "Comment": "Deploy ${GITHUB_SHA}",
            "Parameters": {
              "commands": [
                "set -euo pipefail",
                "curl -fsSL https://raw.githubusercontent.com/JingzeGuo/docmost/${GITHUB_SHA}/scripts/deploy.sh -o /tmp/docmost-deploy.sh",
                "chmod +x /tmp/docmost-deploy.sh",
                "/tmp/docmost-deploy.sh ${GITHUB_SHA}"
              ]
            }
          }
          EOF

          COMMAND_ID=$(
            aws ssm send-command \
              --cli-input-json "file://$RUNNER_TEMP/ssm-command.json" \
              --query "Command.CommandId" \
              --output text
          )

          echo "SSM command ID: $COMMAND_ID"

          INSTANCE_ID=""

          for i in {1..30}; do
            INSTANCE_ID=$(
              aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --query "CommandInvocations[0].InstanceId" \
                --output text
            )

            if [[ -n "$INSTANCE_ID" && "$INSTANCE_ID" != "None" ]]; then
              break
            fi

            sleep 2
          done

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "No SSM invocation found"
            exit 1
          fi

          echo "Target instance: $INSTANCE_ID"

          for i in {1..120}; do
            STATUS=$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text
            )

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"
                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out after 10 minutes"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          exit 1
